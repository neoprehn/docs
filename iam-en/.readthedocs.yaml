# Read the Docs build config fuer die englische Doku (iam-en/docs_en/) -- zweites RTD-Projekt, als
# "Translation" mit dem deutschen Hauptprojekt verknuepft (Sprach-Umschalter). Mirror-Action
# (.github/workflows/docs-mirror.yml) schreibt diese Datei + iam-en/docs_en/ nach neoprehn/docs/iam/, Pfade
# dabei auf "iam/iam-en/docs_en/..." umgeschrieben (Repo-Root-relativ, s. Kommentar in der Action).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: iam-en/docs_en/conf.py

python:
  install:
    - requirements: iam-en/docs_en/requirements.txt
